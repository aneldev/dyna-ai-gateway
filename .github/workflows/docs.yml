# Builds the docs site (website/) and publishes it to GitHub Pages on every merge to main.
# GitHub Pages must be set to Settings > Pages > Source: GitHub Actions.
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "website/**"
      - "packages/dyna-ai-gateway/src/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            website/pnpm-lock.yaml
      # The root install gives TypeDoc the gateway's dependency types.
      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:install --frozen-lockfile
      - run: pnpm docs:build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
